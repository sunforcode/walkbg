# 生产环境配置
server:
  port: 8080
  compression:
    enabled: true

spring:
  # 使用环境变量配置数据库
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/walkbg?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA配置 - 生产环境
  jpa:
    hibernate:
      ddl-auto: validate  # 生产环境不自动修改表结构
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # 禁用H2控制台
  h2:
    console:
      enabled: false

# 禁用开发工具
  devtools:
    restart:
      enabled: false

# 关闭Swagger UI（生产环境）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 日志配置
logging:
  level:
    root: WARN
    org.springframework.web: INFO
    org.example: INFO
    org.hibernate.SQL: WARN
  file:
    name: logs/walkbg.log
    max-size: 10MB
    max-history: 30
