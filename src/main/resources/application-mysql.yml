# MySQL 数据库配置
#
# 使用方式：
# 1. 直接启动（使用默认配置：root用户，空密码）
#    mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# 2. 使用环境变量（推荐）
#    export DB_USERNAME=root
#    export DB_PASSWORD=your_password
#    mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# 3. 使用命令行参数
#    mvn spring-boot:run -Dspring-boot.run.profiles=mysql -Dspring-boot.run.arguments="--spring.datasource.password=your_password"
#
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/walkbg?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}  # 默认空密码，可通过环境变量 DB_PASSWORD 设置
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update  # 生产环境建议改为 validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    defer-datasource-initialization: false

  # 禁用H2控制台
  h2:
    console:
      enabled: false

# 日志配置
logging:
  level:
    org.springframework.web: INFO
    org.example: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
