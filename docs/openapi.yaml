          $ref: '#/components/schemas/WaterPlan'
    CampsiteCreateRequest:
      required:
      - campsite_type
      - name
      type: object
      properties:
        id:
          type: string
        name:
          maxLength: 200
          minLength: 0
          type: string
        description:
          maxLength: 2000
          minLength: 0
          type: string
        latitude:
          maximum: 90.0
