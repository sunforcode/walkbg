# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /walkbg
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# 数据库配置
spring:
  application:
    name: walkbg-service
  
  # 数据源配置
  datasource:
    url: jdbc:h2:file:./data/walkbgdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
    show-sql: true

  # H2控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # 数据初始化配置
  sql:
    init:
      mode: never
      platform: h2
      continue-on-error: false

  # 缓存配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  # Jackson配置
  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

# 日志配置
logging:
  level:
    org.springframework: INFO
    org.example: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/walkbg.log
    max-size: 10MB
    max-history: 30

# 应用自定义配置
app:
  data-initialization:
    enabled: true
  cors:
    allowed-origins: 
      - "http://localhost:3000"
      - "http://localhost:8080"
    allowed-methods: 
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# 和风天气API配置
weather:
  qweather:
    key: ${QWEATHER_API_KEY:YOUR_API_KEY_HERE}
    base-url: https://api.qweather.com/v7
    use-free-api: true
    timeout: 5000
    retry-count: 3

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    show-extensions: true
    show-common-extensions: true
  show-actuator: true
  group-configs:
    - group: 'user-api'
      display-name: '用户管理 API'
      paths-to-match: '/api/users/**'
    - group: 'trip-api'
      display-name: '行程管理 API'
      paths-to-match: '/api/trips/**'
    - group: 'route-api'
      display-name: '路线管理 API'
      paths-to-match: '/api/routes/**'
    - group: 'equipment-api'
      display-name: '装备管家 API'
      paths-to-match: '/api/equipment/**'