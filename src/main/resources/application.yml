# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/walkbg}
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# MySQL 数据库配置
spring:
  application:
    name: walkbg
  
  # MySQL 数据源配置
  # 默认值仅用于本地开发；部署时必须通过环境变量注入
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/walkbg?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true

  # Flyway - 本地开发默认关闭，表结构仍由下方 ddl-auto: update 维护
  # 生产环境在 application-prod.yml 中开启，由迁移脚本作为表结构唯一来源
  flyway:
    enabled: false

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    defer-datasource-initialization: true

  # SQL 初始化配置
  sql:
    init:
      # 改为never,避免每次启动都重新执行SQL脚本,数据会持久化保存在MySQL中
      mode: never
      data-locations: classpath:data-mysql.sql
      continue-on-error: true

  # Web 配置
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/,classpath:/public/

  # MVC 配置
  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**

  # 缓存配置 (Caffeine)
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m
    cache-names:
      - users
      - routes
      - trips

# 日志配置
logging:
  level:
    org.springframework.web: INFO
    org.example: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# SpringDoc 配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# KML Agent Service 配置
# base-url 必须可外部注入：该服务可能部署在其他主机/容器上
kml-agent:
  base-url: ${KML_AGENT_BASE_URL:http://localhost:8001}
  timeout: ${KML_AGENT_TIMEOUT:30}
  enabled: ${KML_AGENT_ENABLED:true}

# CORS 配置
# 逗号分隔的允许来源。默认 * 仅适用于本地开发；
# 同源反代部署时浏览器不会发起跨源请求，此配置不生效。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# JWT 配置
# 此处的默认密钥仅供本地开发使用，切勿用于任何对外环境。
# 生产环境在 application-prod.yml 中要求强制注入 JWT_SECRET。
jwt:
  secret: ${JWT_SECRET:local-dev-only-insecure-secret-key-at-least-256-bits-long-do-not-use}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# 账号媒体只写入运行数据目录，不写入 classpath 或源码资源目录。
account:
  avatar-media:
    directory: ${ACCOUNT_AVATAR_MEDIA_DIRECTORY:data/avatar-media}
    max-size-bytes: ${ACCOUNT_AVATAR_MEDIA_MAX_SIZE_BYTES:5242880}
