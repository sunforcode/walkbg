# Walk 后端 CI/CD
#
# test job：每次 push / PR 跑 walkbg 单元测试（H2 内存库，无需 MySQL）。
# deploy job：push 到 main（或手动触发）时，把三个仓库拼成 compose 所需的 sibling 布局，
#             rsync 到服务器，用 GitHub Secrets 生成 .env，docker compose build && up。
#
# 秘钥全部存放在 GitHub（production environment secrets 或 repo secrets），服务器上不手工维护 .env。
# CI 每次部署都从 secrets 重新生成服务器上的 deploy/.env；
# 最后一次成功部署留下的 .env 留在服务器上，GitHub 不可用时仍可手动 docker compose up 救场。

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 不取消进行中的部署：中途打断会在服务器上留下半构建状态。
concurrency:
  group: walk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test (walkbg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout walkbg
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        # 测试用 @ActiveProfiles("test") + H2 内存库，自包含，无需 MySQL。
        # 不使用 maven-settings.xml 的腾讯镜像：GitHub runner 访问 Maven Central 更稳。
        run: mvn -B test

  deploy:
    name: Deploy to walk-server
    needs: test
    # 只在 push 到 main 或手动触发时部署；PR 与 develop 仅跑测试。
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout walkbg (this repo)
        uses: actions/checkout@v4
        with:
          path: walkbg

      - name: Checkout kml-agent-service
        uses: actions/checkout@v4
        with:
          repository: sunforcode/kml-agent-service
          path: kml-agent-service
          # 公开仓库无需 token。若该仓库为私有，新建 PAT_TOKEN secret（repo scope）并取消下行注释：
          # token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout walkadmin-react
        uses: actions/checkout@v4
        with:
          repository: sunforcode/walkadmin-react
          path: walkadmin-react
          # token: ${{ secrets.PAT_TOKEN }}

      - name: Verify files before deploy
        run: |
          # 关键文件齐备校验：在 runner 上早失败，优于在服务器构建时才发现。
          # 用 find 搜索，不依赖具体路径结构。
          find . -name 'docker-compose.yml' -path '*/deploy/*' | grep -q . || { echo "missing docker-compose.yml"; exit 1; }
          find walkbg -maxdepth 1 -name 'Dockerfile' | grep -q . || { echo "missing walkbg/Dockerfile"; exit 1; }
          find kml-agent-service -maxdepth 1 -name 'Dockerfile' | grep -q . || { echo "missing kml-agent-service/Dockerfile"; exit 1; }
          find walkadmin-react -maxdepth 1 -name 'Dockerfile' | grep -q . || { echo "missing walkadmin-react/Dockerfile"; exit 1; }

      - name: Verify SSH secret is configured
        # 只打印长度不打印值，区分「没建 secret」与「secret 格式错」。
        # webfactory/ssh-agent 的 "argument is empty" 报错本身无法区分这两种情况。
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is EMPTY — not configured at repo or production-env level."
            echo "::error::Create it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "::error::Name must be exactly SSH_PRIVATE_KEY (case-sensitive)."
            echo "::error::Value = full private key including -----BEGIN/END OPENSSH PRIVATE KEY----- lines."
            exit 1
          fi
          echo "SSH_PRIVATE_KEY is configured (length: ${#SSH_PRIVATE_KEY} chars)."

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
        run: |
          HOST="$WALK_SERVER"
          mkdir -p ~/.ssh
          # WALK_SERVER 形如 ubuntu@1.2.3.4，去掉用户名部分再做 keyscan。
          ssh-keyscan -H "${HOST##*@}" >> ~/.ssh/known_hosts

      - name: Sync code to server
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
          WALK_REMOTE_DIR: ${{ secrets.WALK_REMOTE_DIR }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'target' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.log' \
            --exclude 'logs' \
            --exclude '.DS_Store' \
            --exclude 'deploy/.env' \
            --exclude '.env' \
            walkbg kml-agent-service walkadmin-react walkbg/deploy \
            "$WALK_SERVER:$WALK_REMOTE_DIR/"

      - name: Write .env from secrets
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
          WALK_REMOTE_DIR: ${{ secrets.WALK_REMOTE_DIR }}
          # 三个必填秘钥来自 GitHub secrets。
          # 其余项 MYSQL_DATABASE / DB_POOL_MAX / OPENAI_BASE_URL / OPENAI_MODEL / WEB_PORT
          # 在 docker-compose.yml 里有正确默认值（与服务器现有 .env 一致），不写即采用默认。
          # 唯一与默认值不同、必须显式写出的是 CORS_ALLOWED_ORIGINS（默认空会让
          # vialu.cn 跨域被拦）——非敏感的公开域名配置，直接硬编码，不占 secret 配额。
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # 在 runner 临时目录组装 .env，再 scp 到服务器：避免秘钥出现在 ssh 命令行/进程列表。
          # printf + 双引号取环境变量值：shell 不对已替换的值做二次解释，秘钥含 $/特殊字符也原样写入。
          umask 077
          printf '%s\n' \
            "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}" \
            "JWT_SECRET=${JWT_SECRET}" \
            "OPENAI_API_KEY=${OPENAI_API_KEY}" \
            "CORS_ALLOWED_ORIGINS=http://vialu.cn,http://www.vialu.cn,https://vialu.cn,https://www.vialu.cn" \
            > /tmp/.env
          scp /tmp/.env "$WALK_SERVER:$WALK_REMOTE_DIR/deploy/.env"
          rm -f /tmp/.env

      - name: Build and start services
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
          WALK_REMOTE_DIR: ${{ secrets.WALK_REMOTE_DIR }}
        run: |
          # rsync 把 walkbg/deploy 拍平成 $WALK_REMOTE_DIR/deploy/，与各仓库平级。
          # compose 的 build context 是 ../walkbg 等，必须从平级的 deploy/ 起 compose，
          # 否则 ../walkbg 会解析成 walkbg/walkbg 而构建失败。
          # .env 也写在这个 deploy/ 下，compose 会自动加载。
          ssh "$WALK_SERVER" "cd $WALK_REMOTE_DIR/deploy && docker compose build"
          ssh "$WALK_SERVER" "cd $WALK_REMOTE_DIR/deploy && docker compose up -d --remove-orphans"

      - name: Show status
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
          WALK_REMOTE_DIR: ${{ secrets.WALK_REMOTE_DIR }}
        run: |
          ssh "$WALK_SERVER" "cd $WALK_REMOTE_DIR/deploy && docker compose ps"
