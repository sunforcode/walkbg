# H2 内存数据库配置
# 用于快速测试和开发，无需安装 MySQL
#
# 使用方式：
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
#
spring:
  datasource:
    url: jdbc:h2:mem:walkbg;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # H2 控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop  # 启动时创建表，关闭时删除（开发环境）
    show-sql: true      # 显示 SQL
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    defer-datasource-initialization: true

  # SQL 初始化配置
  sql:
    init:
      mode: always
      data-locations: classpath:data-mysql.sql
      continue-on-error: true

# 日志配置（开发环境，显示详细日志）
logging:
  level:
    org.springframework.web: INFO
    org.example: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# 启用 Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
