          minimum: -90.0
          exclusiveMinimum: false
          type: number
          format: double
        longitude:
          maximum: 180.0
          exclusiveMaximum: false
          minimum: -180.0
          exclusiveMinimum: false
          type: number
          format: double
        elevation:
          maximum: 10000.0
          exclusiveMaximum: false
          minimum: -500.0
          exclusiveMinimum: false
          type: number
          format: double
        campsite_type:
          maximum: 5
          minimum: 0
          type: integer
          format: int32
        notes:
          maxLength: 1000
          minLength: 0
          type: string
        verified_by:
          maxLength: 64
          minLength: 0
