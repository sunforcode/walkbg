components:
  schemas:
    Route:
      required:
      - created_at
      - default_map_id
      - id
      - isFavorite
      - isFavoriteByUser
      - isLoop
      - name
      - popularity
      - status
      - updated_at
      - usageCount
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        region:
          type: string
        regionId:
          type: string
        difficulty:
          type: integer
          format: int32
        routeType:
          type: integer
          format: int32
        status:
          type: integer
          format: int32
        cover_url:
          type: string
        default_map_id:
          type: string
        popularity:
          type: integer
          format: int32
        usageCount:
          type: integer
          format: int32
        isLoop:
          type: boolean
        imageUrls:
          type: string
        isFavorite:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        createdBy:
          type: string
        creator:
          $ref: '#/components/schemas/User'
        mapData:
          $ref: '#/components/schemas/RouteMapData'
        isFavoriteByUser:
          type: boolean
        loop:
          type: boolean
          writeOnly: true
        favorite:
          type: boolean
          writeOnly: true
        favoriteByUser:
          type: boolean
          writeOnly: true
        created_by:
          type: string
    RouteMapData:
      required:
      - completionCount
      - createdAt
      - favoriteCount
      - id
      - tripCount
      - updatedAt
      type: object
      properties:
        id:
          type: string
        distance:
          type: number
        duration:
          type: integer
          format: int32
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type: number
        elevationGain:
          type: number
        elevationLoss:
          type: number
        favoriteCount:
          type: integer
          format: int64
        completionCount:
          type: integer
          format: int64
        tripCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    User:
      required:
      - createdAt
      - email
      - id
      - nickname
      - updatedAt
      - username
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
        phone:
          type: string
        bio:
          type: string
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WaterSource:
      required:
      - createdAt
      - id
      - name
      - requiresTreatment
      - updatedAt
      - waterQuality
      - waterQualityEnum
      - waterType
      - waterTypeEnum
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        elevation:
          type: number
          format: double
        waterType:
          type: integer
          format: int32
        waterQuality:
          type: integer
          format: int32
        requiresTreatment:
          type: boolean
        reliability:
          type: number
          format: double
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastVerified:
          type: string
          format: date-time
        verifiedBy:
          $ref: '#/components/schemas/User'
        creator:
          $ref: '#/components/schemas/User'
        route:
          $ref: '#/components/schemas/Route'
        waterTypeEnum:
          type: string
          enum:
          - NATURAL
          - TREATED
          - BOTTLED
          - OTHER
        waterQualityEnum:
          type: string
          enum:
          - EXCELLENT
          - GOOD
          - FAIR
          - POOR
          - UNKNOWN
    ApiResponseWaterSource:
      required:
      - code
      - message
      - success
      - timestamp
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/WaterSource'
        timestamp:
          type: string
          format: date-time
        code:
          type: integer
          format: int32
    Trip:
      required:
      - createdAt
      - id
      - imageUrls
      - name
      - organizerId
      - privacySetting
      - routeIds
      - status
      - updatedAt
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        organizerId:
          type: string
        primaryRouteId:
          type: string
        budget:
          type: number
        actualCost:
          type: number
        notes:
          type: string
        privacySetting:
          type: integer
          format: int32
        coverUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        imageUrls:
          type: array
          items:
            type: string
        routeIds:
          type: array
          items:
            type: string
    WaterPlan:
      required:
      - createdAt
      - id
      - name
      - tags
      - updatedAt
      type: object
      properties:
        id:
          type: string
        tripId:
          type: string
        name:
          type: string
        description:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        trip:
