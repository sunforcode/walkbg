name: API Documentation

on:
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Install Node.js tools
      run: |
        npm install -g redoc-cli
        npm install -g openapi-to-postman

    - name: Build application
      run: mvn clean compile -DskipTests

    - name: Start application
      run: |
        nohup mvn spring-boot:run > app.log 2>&1 &
        echo $! > app.pid

    - name: Wait for application to start
      run: |
        for i in {1..30}; do
          if curl -s -f http://localhost:8080/walkbg/actuator/health > /dev/null; then
            echo "Application started successfully"
            break
          fi
          echo "Waiting for application to start... ($i/30)"
          sleep 10
        done

    - name: Generate API documentation
      run: |
        mkdir -p docs

        # Generate OpenAPI JSON
        curl -s http://localhost:8080/walkbg/api-docs > docs/openapi.json

        # Generate OpenAPI YAML
        curl -s http://localhost:8080/walkbg/api-docs.yaml > docs/openapi.yaml

        # Generate Redoc HTML
        redoc-cli build docs/openapi.json --output docs/redoc.html

        # Generate Postman Collection
        openapi2postman -s docs/openapi.json -o docs/WalkBG-API.postman_collection.json

    - name: Stop application
      run: |
        if [ -f app.pid ]; then
          kill $(cat app.pid) || true
          rm app.pid
        fi

    - name: Generate documentation index
      run: |
        cat > docs/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="zh-CN">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>WalkBG API Documentation</title>
            <style>
                body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
                .header { text-align: center; margin-bottom: 40px; }
                .card { background: #f8f9fa; padding: 20px; margin: 20px 0; border-radius: 8px; }
                .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; margin: 5px; }
                .btn:hover { background: #0056b3; }
            </style>
        </head>
        <body>
            <div class="header">
                <h1>🥾 WalkBG API Documentation</h1>
                <p>Generated on $(date)</p>
            </div>

            <div class="card">
                <h2>📖 Documentation Formats</h2>
                <a href="./redoc.html" class="btn">📄 Redoc HTML</a>
                <a href="./openapi.json" class="btn">📋 OpenAPI JSON</a>
                <a href="./openapi.yaml" class="btn">📋 OpenAPI YAML</a>
                <a href="./WalkBG-API.postman_collection.json" class="btn">📮 Postman Collection</a>
            </div>

            <div class="card">
                <h2>🚀 Quick Start</h2>
                <p>1. Start the application: <code>mvn spring-boot:run</code></p>
                <p>2. Access Swagger UI: <a href="http://localhost:8080/walkbg/swagger-ui/index.html">http://localhost:8080/walkbg/swagger-ui/index.html</a></p>
            </div>
        </body>
        </html>
        EOF

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v3
      with:
        name: api-documentation
        path: docs/
        retention-days: 30

    - name: Comment PR with documentation links
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const { owner, repo, number } = context.issue;
          const body = `
          ## 📖 API Documentation Updated

          The API documentation has been generated for this PR:

          - 📄 [View Documentation](https://github.com/${owner}/${repo}/actions/runs/${{ github.run_id }})
          - 📋 [Download OpenAPI Spec](https://github.com/${owner}/${repo}/actions/runs/${{ github.run_id }})

          ### Changes Summary
          - OpenAPI specification updated
          - Documentation regenerated automatically

          *Documentation generated at: ${new Date().toISOString()}*
          `;

          github.rest.issues.createComment({
            owner,
            repo,
            issue_number: number,
            body
          });
