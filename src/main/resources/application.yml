# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /walkbg
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# MySQL 数据库配置
spring:
  application:
    name: walkbg
  
  # MySQL 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/walkbg?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    defer-datasource-initialization: true

  # SQL 初始化配置
  sql:
    init:
      # 改为never,避免每次启动都重新执行SQL脚本,数据会持久化保存在MySQL中
      mode: never
      data-locations: classpath:data-mysql.sql
      continue-on-error: true

  # Web 配置
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/,classpath:/public/

  # MVC 配置
  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**

  # 缓存配置 (Caffeine)
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m
    cache-names:
      - users
      - routes
      - trips

# 日志配置
logging:
  level:
    org.springframework.web: INFO
    org.example: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# SpringDoc 配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
