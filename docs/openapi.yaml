  /api/v1/routes:
    get:
      tags:
      - 路线管理
      summary: 分页查询路线列表
      description: 获取路线列表，支持分页
      operationId: getRoutes
      parameters:
      - name: page
        in: query
        description: 页码，从0开始
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: 每页大小
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: keyword
        in: query
        description: 关键词搜索
        required: false
        schema:
          type: string
      - name: regionId
        in: query
        description: 区域ID
        required: false
        schema:
          type: string
      - name: difficulty
        in: query
        description: 难度等级
        required: false
        schema:
          type: integer
          format: int32
      - name: routeType
        in: query
        description: 路线类型
        required: false
        schema:
          type: integer
          format: int32
      - name: minDistance
        in: query
        description: 最小距离
        required: false
        schema:
          type: number
          format: double
      - name: maxDistance
        in: query
        description: 最大距离
        required: false
        schema:
          type: number
          format: double
      - name: userId
        in: query
        description: 用户ID
        required: false
        schema:
          type: string
