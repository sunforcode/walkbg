# MySQL 本地开发配置
#
# 这是一个本地开发专用的配置文件
# 如果你的 MySQL 有密码，可以直接在这里配置
#
# 使用方式：
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql-local
#
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/walkbg?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password:  # 👈 在这里填写你的 MySQL 密码（如果有的话）
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update  # 自动更新表结构
    show-sql: true      # 显示 SQL（开发环境）
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    defer-datasource-initialization: false

  # 禁用H2控制台
  h2:
    console:
      enabled: false

# 日志配置（开发环境，显示详细日志）
logging:
  level:
    org.springframework.web: INFO
    org.example: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
